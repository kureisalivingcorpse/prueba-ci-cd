name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos requeridos
        shell: bash
        run: |
          missing=0

          for file in index.html script.js; do
            if [[ ! -f "$file" ]]; then
              echo "Error: no existe el archivo requerido: $file" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "El despliegue se detuvo porque faltan archivos requeridos." >&2
            exit 1
          fi

          echo "index.html y script.js existen."

  deploy:
    needs: check-files
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
